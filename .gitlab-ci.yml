stages:
  - test
  - build
  - e2e

variables:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

default:
  image: node:24-alpine
  before_script:
    - corepack enable
    - yarn --version
    - yarn install --immutable
  cache:
    key: yarn-{{ checksum "yarn.lock" }}
    paths:
      - /root/.yarn/berry/cache

lint:
  stage: test
  script:
    - yarn typecheck
    - yarn lint
    - yarn format:check

unit:
  stage: test
  script:
    - yarn test:coverage
  coverage: '/All files\s+\|\s+([0-9.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week

build:
  stage: build
  script:
    - yarn build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  before_script:
    - if command -v corepack > /dev/null 2>&1; then corepack enable; else npm install -g @yarnpkg/cli-dist; fi
    - yarn --version
    - yarn install --immutable
  script:
    - yarn test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week
