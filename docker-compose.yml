services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vite_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vite_app']
      interval: 5s
      timeout: 3s
      retries: 10
